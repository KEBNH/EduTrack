name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests y analisis de seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Verificar configuracion de Django
        run: python manage.py check

      - name: Ejecutar tests
        run: python manage.py test

      - name: Analisis de seguridad con Bandit
        run: bandit -r backend -ll -ii --exclude "backend/**/migrations/**,backend/**/__pycache__/**"

  deploy-dev:
    name: Deploy a Desarrollo
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Deploy a Dev en Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEV_HOOK }}"
          echo "Deploy a Dev disparado"

      - name: Esperar que Render inicie
        run: sleep 30

  smoke-test-dev:
    name: Smoke Test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Verificar que Dev responde
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://edutrack-dev-server.onrender.com/)
            if [[ "$STATUS" -eq 200 ]]; then
              echo "Dev responde correctamente (HTTP $STATUS)"
              exit 0
            fi
            echo "Intento $i fallido (HTTP $STATUS), reintentando..."
            sleep 10
          done
          echo "Dev no responde despues de 5 intentos"
          exit 1

  deploy-prod:
    name: Deploy a Produccion
    needs: smoke-test-dev
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Deploy a Prod en Render
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_PROD_HOOK }}"
          echo "Deploy a Produccion disparado"
